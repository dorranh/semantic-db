[workspace]
members = [
    "crates/*",
    "apps/*",
    "examples/team_catalog",
    "examples/ossie_wells",
    "examples/authored_views",
    "examples/github",
    "examples/connectors",
    "tests/performance",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
semantic-db = { path = "crates/semantic-db", default-features = false }
semantic-cli = { path = "apps/semantic-cli" }
semantic-materialization = { path = "crates/semantic-materialization" }
semantic-runtime = { path = "crates/semantic-runtime" }
semantic-sources = { path = "crates/semantic-sources" }
async-trait = "0.1"
semantic-catalog = { path = "crates/semantic-catalog" }
semantic-plan = { path = "crates/semantic-plan" }
semantic-ossie = { path = "crates/semantic-ossie" }
semantic-github = { path = "crates/semantic-github" }
semantic-clickhouse = { path = "crates/semantic-clickhouse" }
datafusion-federation = { version = "=0.5.6", features = ["sql"] }
clickhouse = { version = "0.15.2", default-features = false, features = ["rustls-tls-ring", "rustls-tls-webpki-roots"] }
arrow-ipc = { version = "59.2", features = ["lz4", "zstd"] }
async-stream = "0.3"
testcontainers = { version = "0.28", features = ["http_wait_plain"] }
semantic-engine = { path = "crates/semantic-engine" }
semantic-compiler = { path = "crates/semantic-compiler" }
arrow-schema = "59.2.0"
datafusion = { version = "55.0.0", default-features = false, features = ["sql", "recursive_protection"] }
clap = { version = "4.5", features = ["derive"] }
rustyline = "17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.2"
jsonschema = { version = "0.56", default-features = false }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dotenvy = "0.15"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev]
debug = 1

[profile.test]
debug = 1
