[workspace]
members = ["crates/*", "apps/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
semantic-catalog = { path = "crates/semantic-catalog" }
semantic-plan = { path = "crates/semantic-plan" }
semantic-ossie = { path = "crates/semantic-ossie" }
semantic-engine = { path = "crates/semantic-engine" }
semantic-compiler = { path = "crates/semantic-compiler" }
arrow-schema = "59.2.0"
datafusion = { version = "55.0.0", default-features = false, features = ["sql", "recursive_protection"] }
clap = { version = "4.5", features = ["derive"] }
rustyline = "17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.2"
jsonschema = { version = "0.56", default-features = false }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dotenvy = "0.15"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev]
debug = 1

[profile.test]
debug = 1
