name: Package maintenance example
on: [push, pull_request]
jobs:
  example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/package-maintenance
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/package-maintenance/package-lock.json
      - run: npm ci
      - run: npm run setup
      - run: npm test && npm run build
      - run: cargo test -p semantic-postgres -p semantic-sources --features semantic-sources/postgres --locked connector_integration_postgres -- --ignored
      - run: cargo build -p semantic-server --features github --locked
      - run: npm install --global agent-browser@0.34.0 && agent-browser install --with-deps
      - name: Application and browser checks
        run: |
          mkdir -p .run
          npm start > .run/application.log 2>&1 &
          trap 'npm run stop' EXIT
          for i in $(seq 1 240); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5173/ > /dev/null
          npm run reconcile
          npm run test:integration
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-maintenance-checks
          path: examples/package-maintenance/.run/
