[package]
name = "semantic-db"
description = "Embed catalog-aware SQL and natural-language queries with application-owned backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["compiler"]
compiler = ["dep:semantic-compiler"]
ossie = ["dep:semantic-ossie"]
sources = ["ossie", "dep:semantic-sources"]
github = ["dep:semantic-github", "semantic-sources?/github"]
clickhouse = ["dep:semantic-clickhouse", "semantic-sources?/clickhouse"]
postgres = ["dep:semantic-postgres", "semantic-sources?/postgres"]

[dependencies]
semantic-sources = { workspace = true, optional = true }
semantic-catalog.workspace = true
semantic-engine.workspace = true
semantic-plan.workspace = true
semantic-compiler = { workspace = true, optional = true }
semantic-ossie = { workspace = true, optional = true }
semantic-github = { workspace = true, optional = true }
semantic-clickhouse = { workspace = true, optional = true }
semantic-postgres = { workspace = true, optional = true }
datafusion.workspace = true

[dev-dependencies]
tokio.workspace = true
serde_json.workspace = true

[lints]
workspace = true
