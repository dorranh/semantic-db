[package]
name = "semantic-db"
description = "Embed catalog-aware SQL and natural-language queries with application-owned backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["compiler"]
compiler = ["dep:semantic-compiler"]
ossie = ["dep:semantic-ossie"]
github = ["dep:semantic-github"]

[dependencies]
semantic-catalog.workspace = true
semantic-engine.workspace = true
semantic-plan.workspace = true
semantic-compiler = { workspace = true, optional = true }
semantic-ossie = { workspace = true, optional = true }
semantic-github = { workspace = true, optional = true }
datafusion.workspace = true

[dev-dependencies]
tokio.workspace = true
serde_json.workspace = true
clap.workspace = true
dotenvy.workspace = true
rustyline.workspace = true

[[example]]
name = "ossie_wells"
required-features = ["ossie"]

[[example]]
name = "github"
required-features = ["ossie", "github", "compiler"]

[lints]
workspace = true
