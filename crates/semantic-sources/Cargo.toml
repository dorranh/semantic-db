[package]
name = "semantic-sources"
description = "Shared configured source loading and connector registry for Semantic DB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
github = ["dep:semantic-github"]
clickhouse = ["dep:semantic-clickhouse"]
postgres = ["dep:semantic-postgres"]

[dependencies]
tokio.workspace = true
semantic-runtime.workspace = true
semantic-engine.workspace = true
semantic-ossie.workspace = true
semantic-github = { workspace = true, optional = true }
semantic-clickhouse = { workspace = true, optional = true }
semantic-postgres = { workspace = true, optional = true }
datafusion.workspace = true
arrow-schema = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
futures.workspace = true
thiserror.workspace = true

[dev-dependencies]
arrow-avro = { version = "59.2", default-features = false }
flate2 = "1"
tokio-postgres.workspace = true
semantic-catalog.workspace = true
tokio.workspace = true
testcontainers.workspace = true
clickhouse.workspace = true

[lints]
workspace = true
