services:
  postgres:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
      POSTGRES_DB: commerce
      TZ: UTC
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce"]
      interval: 1s
      timeout: 3s
      retries: 60
    volumes:
      - fixture-db:/var/lib/postgresql/data
  bootstrap:
    image: postgres:16.6-bookworm
    environment:
      PGHOST: postgres
      PGUSER: commerce
      PGPASSWORD: commerce
      PGDATABASE: commerce
    volumes:
      - ./bootstrap:/bootstrap:ro
      - ./data:/data:ro
    entrypoint: ["bash", "/bootstrap/seed.sh"]
volumes:
  fixture-db:
