services:
  postgres:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_USER: bird
      POSTGRES_PASSWORD: bird
      POSTGRES_DB: bird
      TZ: UTC
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bird -d bird"]
      interval: 1s
      timeout: 3s
      retries: 60
    volumes:
      - fixture-db:/var/lib/postgresql/data
  bootstrap:
    image: postgres:16.6-bookworm
    environment:
      PGHOST: postgres
      PGUSER: bird
      PGPASSWORD: bird
      PGDATABASE: bird
    volumes:
      - ./bootstrap:/bootstrap:ro
      - ./data:/data:ro
    entrypoint: ["bash", "/bootstrap/seed.sh"]
volumes:
  fixture-db:
