[package]
name = "semantic-cli"
description = "Interactive SQL frontend for Semantic DB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.dist]
dist = true

[[bin]]
name = "sdb"
path = "src/main.rs"

[dependencies]
semantic-server = { path = "../semantic-server" }
serde_json.workspace = true
semantic-sources = { workspace = true, features = ["clickhouse", "postgres"] }
semantic-engine.workspace = true
semantic-compiler.workspace = true
semantic-ossie.workspace = true
dotenvy.workspace = true
clap.workspace = true
rustyline.workspace = true
tokio.workspace = true
datafusion.workspace = true
directories = "6"

[dev-dependencies]
reqwest.workspace = true
tokio-postgres.workspace = true
arrow-avro = { version = "59.2", default-features = false }
flate2 = "1"

[lints]
workspace = true
